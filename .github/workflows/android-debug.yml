name: Android Debug APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      EXPECTED_SIGNER_SHA256: "FA:B5:68:33:BD:3B:FA:F7:DB:00:B6:CC:73:C2:9D:36:DA:C6:AB:29:E6:56:65:07:9F:E8:B4:F2:B0:92:87:8A"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare Godot environment
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi
          if [ -d /root/.config/godot ] && [ "$HOME" != "/root" ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi

      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: build/ci/debug.keystore
          key: binding-of-ismael-debug-keystore-v1

      - name: Verify persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s build/ci/debug.keystore ]; then
            echo "ERROR: Persistent Android signing key is missing."
            echo "Refusing to generate a new key because that would break APK updates."
            exit 1
          fi

          ACTUAL_SHA256="$(keytool -list -v \
            -keystore build/ci/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1)"

          echo "Expected signer: $EXPECTED_SIGNER_SHA256"
          echo "Actual signer:   $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "ERROR: Signing key fingerprint changed. Refusing to build."
            exit 1
          fi

      - name: Set monotonic Android version code
        shell: bash
        run: |
          set -euo pipefail
          AUTO_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/^version\/code=.*/version\/code=${AUTO_VERSION_CODE}/" export_presets.cfg
          echo "Android versionCode=${AUTO_VERSION_CODE}"
          grep -E '^version/(code|name)=' export_presets.cfg

      - name: Validate Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --quit 2>&1 | tee build/ci/godot-import.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script" build/ci/godot-import.log; then
            echo "Godot script validation failed"
            exit 1
          fi

      - name: Export signed debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/android
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$PWD/build/ci/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --export-debug "Android Debug" build/android/Binding-of-Ismael-debug.apk 2>&1 | tee build/ci/godot-export.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script" build/ci/godot-export.log; then
            echo "Godot export contained script errors"
            rm -f build/android/Binding-of-Ismael-debug.apk
            exit 1
          fi

      - name: Verify APK signature and file
        shell: bash
        run: |
          set -euo pipefail
          test -s build/android/Binding-of-Ismael-debug.apk

          APK_SHA256="$(keytool -printcert -jarfile build/android/Binding-of-Ismael-debug.apk \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1)"

          echo "APK signer: $APK_SHA256"
          if [ "$APK_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "ERROR: Exported APK signer does not match the pinned signing certificate."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binding-of-Ismael-debug-apk
          path: build/android/Binding-of-Ismael-debug.apk
          if-no-files-found: error
          retention-days: 3
